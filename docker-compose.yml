services:
  db:
    image: postgres:16-alpine
    container_name: localservices_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: LocalServicesDb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d LocalServicesDb"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    container_name: localservices_web
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=LocalServicesDb;Username=postgres;Password=postgres;
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_images:/app/wwwroot/images

volumes:
  postgres_data:
  app_images:
